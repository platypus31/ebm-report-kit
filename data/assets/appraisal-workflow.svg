<text x="90" y="622" font-family="Georgia, serif" font-size="13" font-weight="400" fill="#8A9099" text-anchor="start" letter-spacing="0.2">第 2 步的工具、第 4 步的等級表都是固定素材：工具見「評讀工具對照表」，等級見「OCEBM 2011 證據等級表」。</text>
<text x="90" y="640" font-family="Georgia, serif" font-size="13" font-weight="400" fill="#8A9099" text-anchor="start" letter-spacing="0.2">第 5 步不是覆述結論，而是把等級換算成對這位病人可執行的建議（含做不到時的替代方案）。</text>
<text x="90" y="700" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#8A9099" text-anchor="start" letter-spacing="0.2">依實證醫學嚴格評讀通用教學流程內容自繪</text>
</svg>