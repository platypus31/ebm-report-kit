<text x="90" y="120" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#1A1A1A" text-anchor="start" letter-spacing="1.2">評讀流程五步驟</text>
<line x1="90" y1="145" x2="1190" y2="145" stroke="#C4C9D0" stroke-width="2"/>
<rect x="90" y="226" width="196" height="96" fill="#FFFFFF" stroke="#3D434B" stroke-width="2.5"/>
<text x="188.0" y="282.0" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#1A1D21" text-anchor="middle" letter-spacing="0.3">挑選適當文獻</text>
<circle cx="90" cy="226" r="19" fill="#3D434B"/>
<text x="90.0" y="234" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">1</text>
<text x="188.0" y="180" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#8A9099" text-anchor="middle" letter-spacing="0.2">依 PICO 與研究設計挑</text>
<text x="188.0" y="200" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#8A9099" text-anchor="middle" letter-spacing="0.2">最貼近的一篇</text>
<rect x="316" y="442" width="196" height="96" fill="#FFFFFF" stroke="#3D434B" stroke-width="2.5"/>
<text x="414.0" y="498.0" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#1A1D21" text-anchor="middle" letter-spacing="0.3">挑選評讀工具</text>
<circle cx="316" cy="442" r="19" fill="#3D434B"/>
<text x="316.0" y="450" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">2</text>
<text x="414.0" y="564" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#8A9099" text-anchor="middle" letter-spacing="0.2">按研究型別選對應清單</text>
<text x="414.0" y="584" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#8A9099" text-anchor="middle" letter-spacing="0.2">（例：CASP）</text>
<rect x="542" y="226" width="196" height="96" fill="#FFFFFF" stroke="#3D434B" stroke-width="2.5"/>
<text x="640.0" y="282.0" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#1A1D21" text-anchor="middle" letter-spacing="0.3">嚴格評讀</text>
<circle cx="542" cy="226" r="19" fill="#3D434B"/>
<text x="542.0" y="234" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">3</text>
<text x="640.0" y="180" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#8A9099" text-anchor="middle" letter-spacing="0.2">逐題作答，Can't tell</text>
<text x="640.0" y="200" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#8A9099" text-anchor="middle" letter-spacing="0.2">誠實勾</text>
<rect x="768" y="442" width="196" height="96" fill="#FFFFFF" stroke="#3D434B" stroke-width="2.5"/>
<text x="866.0" y="498.0" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#1A1D21" text-anchor="middle" letter-spacing="0.3">評定證據等級</text>
<circle cx="768" cy="442" r="19" fill="#3D434B"/>
<text x="768.0" y="450" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">4</text>
<text x="866.0" y="564" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#8A9099" text-anchor="middle" letter-spacing="0.2">對照 OCEBM 2011 標出</text>
<text x="866.0" y="584" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#8A9099" text-anchor="middle" letter-spacing="0.2">落點</text>
<rect x="994" y="226" width="196" height="96" fill="#FFFFFF" stroke="#3D434B" stroke-width="2.5"/>
<text x="1092.0" y="267.0" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#1A1D21" text-anchor="middle" letter-spacing="0.3">評定推薦等級，給</text>
<text x="1092.0" y="297.0" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#1A1D21" text-anchor="middle" letter-spacing="0.3">予建議</text>
<circle cx="994" cy="226" r="19" fill="#3D434B"/>
<text x="994.0" y="234" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">5</text>
<text x="1092.0" y="180" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#8A9099" text-anchor="middle" letter-spacing="0.2">回到病人，給可執行的</text>
<text x="1092.0" y="200" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#8A9099" text-anchor="middle" letter-spacing="0.2">臨床建議</text>
