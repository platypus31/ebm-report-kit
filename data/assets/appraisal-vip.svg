<text x="90" y="120" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#1A1A1A" text-anchor="start" letter-spacing="1.2">嚴格評讀 VIP 框架</text>
<line x1="90" y1="145" x2="1190" y2="145" stroke="#C4C9D0" stroke-width="2"/>
<circle cx="300" cy="288" r="96" fill="#3D434B"/>
<circle cx="300" cy="288" r="96" fill="none" stroke="#B0B6BE" stroke-width="1.5"/>
<text x="300" y="284" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">Validity</text>
<line x1="242" y1="296" x2="358" y2="296" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>
<text x="300" y="320" font-family="Georgia, serif" font-size="19" font-weight="400" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">(Reliability)</text>
<text x="300" y="430" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#1A1D21" text-anchor="middle" letter-spacing="0.5">效度／信度</text>
<text x="300" y="468" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#2A2A2A" text-anchor="middle" letter-spacing="0.2">我們可以相信這個證據嗎？</text>
<text x="300" y="508" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#8A9099" text-anchor="middle" letter-spacing="0.2">看設計與執行：隨機、盲化、</text>
<text x="300" y="529" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#8A9099" text-anchor="middle" letter-spacing="0.2">追蹤完整度、混雜是否控制好</text>
<circle cx="640" cy="288" r="96" fill="#6B7280"/>
<circle cx="640" cy="288" r="96" fill="none" stroke="#B0B6BE" stroke-width="1.5"/>
<text x="640" y="284" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">Importance</text>
<line x1="582" y1="296" x2="698" y2="296" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>
<text x="640" y="320" font-family="Georgia, serif" font-size="19" font-weight="400" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">(Impact)</text>
<text x="640" y="430" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#1A1D21" text-anchor="middle" letter-spacing="0.5">重要性</text>
<text x="640" y="468" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#2A2A2A" text-anchor="middle" letter-spacing="0.2">相信了，但這個結果重要嗎？</text>
<text x="640" y="508" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#8A9099" text-anchor="middle" letter-spacing="0.2">看效應量與精確度：ARR／NNT、</text>
<text x="640" y="529" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#8A9099" text-anchor="middle" letter-spacing="0.2">95% CI 寬窄，不只看 p 值</text>
<circle cx="980" cy="288" r="96" fill="#A6ACB4"/>
<circle cx="980" cy="288" r="96" fill="none" stroke="#B0B6BE" stroke-width="1.5"/>
<text x="980" y="284" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#1A1D21" text-anchor="middle" letter-spacing="0.4">Practice</text>
<line x1="922" y1="296" x2="1038" y2="296" stroke="#1A1D21" stroke-width="1.2" opacity="0.7"/>
<text x="980" y="320" font-family="Georgia, serif" font-size="19" font-weight="400" fill="#1A1D21" text-anchor="middle" letter-spacing="0.3">(Applicability)</text>
<text x="980" y="430" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#1A1D21" text-anchor="middle" letter-spacing="0.5">臨床適用性</text>
<text x="980" y="468" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#2A2A2A" text-anchor="middle" letter-spacing="0.2">結果能用在我的病人身上嗎？</text>
<text x="980" y="508" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#8A9099" text-anchor="middle" letter-spacing="0.2">看族群、劑量、照護環境、</text>
<text x="980" y="529" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#8A9099" text-anchor="middle" letter-spacing="0.2">可近性是否對得上</text>
<line x1="90" y1="604" x2="1190" y2="604" stroke="#C4C9D0" stroke-width="1.5"/>
<text x="640.0" y="634" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#8A9099" text-anchor="middle" letter-spacing="0.3">三關依序過：V 不過就不必談 I，I 不過就不必談 P</text>
<text x="90" y="700" font-family="Georgia, serif" font-size="15" font-weight="400" fill="#8A9099" text-anchor="start" letter-spacing="0.2">依實證醫學 VIP（Validity／Importance／Practice）評讀框架通用教學內容自繪</text>
</svg>