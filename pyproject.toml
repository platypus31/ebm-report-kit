[project]
name = "ebm-report-kit"
version = "1.0.0"
description = "EBM 報告產生器"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "pymupdf>=1.23",
    "python-pptx>=0.6.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
