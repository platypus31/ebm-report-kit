  body{margin:0;background:#F5F6F8;font-family:"Songti TC","Noto Serif TC",serif}
  #card{width:1500px;padding:56px 70px;box-sizing:border-box;background:#FFFFFF;border:1px solid #C4C9D0}
  p{font-size:34px;line-height:1.9;color:#1A1D21;margin:0 0 26px;text-align:justify;text-indent:2em}

<div id="card">
  <p>陳伯伯，68 歲男性，有第二型糖尿病與高血壓，長期於家庭醫學科門診規則追蹤，血糖與血壓控制尚可。
  他平日與兒子同住，生活可完全自理，除了每年秋天接種流感疫苗外，從未接種過任何肺炎鏈球菌疫苗。
  近期社區 COVID-19 疫情再起，陳伯伯的兒子在網路社團看到一則貼文，內容宣稱「打過肺炎鏈球菌疫苗的
  長輩比較不會得新冠，得了也比較不會住院」。這次陪父親回診時，兒子特地提出了他的疑問：</p>
  <div class="q">「醫師，聽說打肺炎鏈球菌疫苗的人比較不會得新冠？真的有這回事嗎？
  如果是真的，是不是應該趕快帶我爸去打一劑？」</div>
</div>
