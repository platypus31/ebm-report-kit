<!doctype html><meta charset="utf-8">
<style>
  body{margin:0;background:#F5F6F8;font-family:"Songti TC","Noto Serif TC",serif}
  #card{width:1560px;padding:44px 50px;box-sizing:border-box;background:#FFFFFF;border:1px solid #C4C9D0}
  .row{display:flex;align-items:stretch;gap:0;justify-content:space-between}
  .node{flex:1;border:2.5px solid #3D434B;padding:26px 20px;text-align:center;background:#F7F8FA}
  .node h3{margin:0 0 12px;font-size:30px;color:#1A1D21}
  .node p{margin:0;font-size:23px;line-height:1.55;color:#4A4F57}
  .arrow{display:flex;align-items:center;font-size:44px;color:#8A9099;padding:0 16px}
  .node.bad{border-color:#8B1E1E;background:#FBF3F3}
  .node.bad h3{color:#8B1E1E}
  .foot{margin-top:26px;font-size:22px;color:#8A9099}
</style>
<div id="card">
  <div class="row">
    <div class="node"><h3>鼻咽「帶菌」</h3><p>肺炎鏈球菌無症狀<br>寄居在上呼吸道</p></div>
    <div class="arrow">→</div>
    <div class="node"><h3>病毒來襲</h3><p>流感、RSV、冠狀病毒<br>感染上呼吸道</p></div>
    <div class="arrow">→</div>
    <div class="node bad"><h3>細菌×病毒 交互作用</h3><p>帶菌者更容易感染病毒、<br>更容易出現症狀</p></div>
    <div class="arrow">→</div>
    <div class="node bad"><h3>疾病加重</h3><p>肺炎、住院<br>重症風險上升</p></div>
  </div>
  <div class="foot">結合型疫苗（PCV13）能減少「帶菌」——從這條路徑的第一站就介入；這正是本篇研究的假說基礎</div>
</div>
